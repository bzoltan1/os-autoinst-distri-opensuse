name: execve trace - cups/rpcbind/postgresql binary discovery
description: >
    ftrace sched_process_exec tracing to discover all binaries
    executed during cups, rpcbind, and postgresql_server tests.
    Compare the output with the coverage_targets of tw_o3.yaml
    to find binaries that are not instrumented yet.
    Boots the create_hdd_agama_textmode image; the test suite sets
    HDD_1 and UEFI_PFLASH_VARS.
    Maintainer: balogh
vars:
    BOOT_HDD_IMAGE: 1
schedule:
    - installation/bootloader_start
    - boot/boot_to_desktop
    - console/system_prepare
    - console/consoletest_setup
    - coverage/execve_trace_start
    - console/cups
    - console/rpcbind
    - console/postgresql_server
    - coverage/execve_trace_report
