name: coverage - grafana log scope verification
description: >
    Verify grafana_setup removes only grafana logs: cpio coverage must
    survive until coverage_report.
schedule:
  - installation/bootloader_start
  - boot/boot_to_desktop
  - console/system_prepare
  - console/consoletest_setup
  - coverage/coverage_setup
  - console/cpio
  - coverage/grafana_setup
  - console/oqa_agnostic/grafana_agnostic
  - coverage/coverage_report
test_data:
  helper_packages:
    - gzip
    - iputils
    - systemd
    - wget
  coverage_targets:
    cpio: /usr/bin/cpio
    grafana: /usr/libexec/grafana/grafana
