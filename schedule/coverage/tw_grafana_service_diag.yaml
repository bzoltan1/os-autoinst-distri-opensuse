name: coverage - grafana service flush diagnostic
description: Start/stop grafana-server under the shim and upload flush diagnostics.
schedule:
  - installation/bootloader_start
  - boot/boot_to_desktop
  - console/system_prepare
  - console/consoletest_setup
  - coverage/coverage_setup
  - coverage/grafana_include_filter
  - coverage/grafana_shim_caps
  - coverage/grafana_service_diag
  - coverage/coverage_report
test_data:
  helper_packages:
    - gzip
    - iputils
    - systemd
    - wget
  coverage_targets:
    grafana: /usr/libexec/grafana/grafana
