name: experiment - zypper timing with and without the agama image repos
description: >
    Throwaway experiment, not for upstream.
vars:
    BINARY_COVERAGE: 1
schedule:
    - installation/bootloader_start
    - boot/boot_to_desktop
    - console/system_prepare
    - console/consoletest_setup
    - coverage/coverage_setup
    - coverage/exp_zypper_timing
