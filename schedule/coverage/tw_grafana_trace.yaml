name: coverage - grafana trace diagnostic
description: Direct funkoverage trace of grafana --version with debug logging.
schedule:
  - installation/bootloader_start
  - boot/boot_to_desktop
  - console/system_prepare
  - console/consoletest_setup
  - coverage/coverage_setup
  - coverage/grafana_trace_diag
  - coverage/coverage_report
test_data:
  helper_packages:
    - gzip
    - iputils
    - systemd
    - wget
  coverage_targets:
    grafana: /usr/libexec/grafana/grafana
