name: coverage - cups/rpcbind/postgresql with discovered targets
description: >
    Coverage measurement for cups, rpcbind, and postgresql_server
    with all binary targets discovered via ftrace tracing (o3 #6194032).
    Maintainer: balogh
schedule:
    - autoyast/prepare_profile
    - installation/isosize
    - installation/bootloader_uefi
    - autoyast/installation
    - autoyast/console
    - autoyast/login
    - autoyast/autoyast_reboot
    - installation/grub_test
    - installation/first_boot
    - console/system_prepare
    - coverage/coverage_setup
    - console/cups
    - console/rpcbind
    - console/postgresql_server
    - coverage/coverage_report
test_data:
    helper_packages:
        - gzip
        - iputils
        - systemd
        - wget
    coverage_targets:
        cups:
            - /usr/sbin/cupsd
        cups-client:
            - /sbin/lpadmin
            - /usr/bin/cancel
            - /usr/bin/lp
            - /usr/bin/lpoptions
            - /usr/bin/lpq
            - /usr/bin/lpstat
        rpcbind: /usr/sbin/rpcbind
        nfs-client:
            - /sbin/mount.nfs
            - /usr/sbin/rpc.statd
            - /usr/sbin/rpc.idmapd
            - /usr/sbin/nfsdcld
            - /usr/sbin/sm-notify
            - /usr/libexec/nfsrahead
        nfs-kernel-server:
            - /usr/sbin/exportfs
            - /usr/sbin/rpc.mountd
            - /usr/sbin/rpc.nfsd
            - /usr/sbin/nfsdctl
        postgresql18-server:
            - /usr/lib/postgresql18/bin/postgres
            - /usr/lib/postgresql18/bin/psql
            - /usr/lib/postgresql18/bin/initdb
            - /usr/lib/postgresql18/bin/pg_ctl
            - /usr/lib/postgresql18/bin/dropdb
        gpg2: /usr/libexec/scdaemon
