  - console/oqa_agnostic/libsoup
  - console/oqa_agnostic/evolution_data_server
  - console/oqa_agnostic/glib_networking
  - security/oqa_agnostic/openssl_pqc
  - security/oqa_agnostic/apachessl_pqc
  - security/oqa_agnostic/oqs_provider_openssl
  - security/oqa_agnostic/polkit_rules
  - security/oqa_agnostic/yama
  - security/oqa_agnostic/fips_java_crypto
